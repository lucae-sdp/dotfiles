"$schema" = 'https://starship.rs/config-schema.json'

# ~/.config/starship.toml
#
# Estilo encadeado, 3 tons, Catppuccin Mocha.
#
# ARQUITETURA DA CORRENTE
#   bloco 1  #89b4fa  blue      -> símbolo do OS
#   bloco 2  #45475a  surface1  -> diretório
#   bloco 3  #313244  surface0  -> git + lua + relógio
#
# Os três blocos SEMPRE existem. git_branch e lua são condicionais,
# mas dividem o bloco 3 com o relógio, que é permanente — por isso a
# corrente nunca quebra. Esse é o erro que quase todo preset pronto
# comete: quando o módulo condicional some, a seta de transição fica
# com a cor do fundo errado.
#
# ÍCONES em escape \uXXXX: ASCII puro, não corrompe no copiar e colar.
# Se algum aparecer como quadradinho, é a fonte; se aparecer o texto
# literal "\ue0a0", a string está com aspas SIMPLES (TOML só processa
# escape em aspas duplas).

format = """
$username\
$hostname\
$os\
[\ue0b0](fg:#89b4fa bg:#45475a)\
$directory\
[\ue0b0](fg:#45475a bg:#313244)\
$git_branch\
$lua\
$time\
[\ue0b0](fg:#313244)\
$line_break\
$character"""

command_timeout = 500

### Bloco 1 — os, username and hostname ###

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:#89b4fa fg:#11111b"

[os.symbols]
Arch = "\U000F08C7"

[username]
show_always = true
style_user = "bg:#89b4fa fg:#11111b"
style_root = "bg:#89b4fa fg:#11111b"
format = '[ $user]($style)'

[hostname]
disabled = false
ssh_only = false
format = "[@$hostname]($style)"
style = "bg:#89b4fa fg:#11111b"

#### Bloco 2 — diretório ######################################

[directory]
format = "[ $path ]($style)[$read_only ]($read_only_style)"
style = "bg:#45475a fg:#cdd6f4"
read_only = " \uf023"
read_only_style = "bg:#45475a fg:#f38ba8"
truncation_length = 2
truncate_to_repo = true
truncation_symbol = "\u2026/"
home_symbol = "~"

#### Bloco 3 — contexto #######################################

[git_branch]
symbol = "\ue0a0"
format = "[ $symbol $branch ]($style)"
style = "bg:#313244 fg:#cba6f7"

[lua]
symbol = "\ue620"
format = "[ $symbol $version ]($style)"
style = "bg:#313244 fg:#89b4fa"
version_format = "v${major}.${minor}"

[time]
disabled = false
time_format = "%R"
format = "[ \uf017 $time ]($style)"
style = "bg:#313244 fg:#a6adc8"

#### Segunda linha ############################################

[character]
success_symbol = "[\u276f](#cba6f7)"
error_symbol   = "[\u276f](#f38ba8)"
vimcmd_symbol  = "[\u276e](#a6e3a1)"

#### Desligados ###############################################
# Você pediu enxuto. Ligue um por vez, só se sentir falta.

[git_status]
disabled = true

[battery]
disabled = true

[cmd_duration]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true
