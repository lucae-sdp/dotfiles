"$schema" = 'https://starship.rs/config-schema.json'

# ~/.config/starship.toml
#
# CORREÇÃO: todos os ícones agora são escapes Unicode (\uXXXX) em vez
# de glifos colados. Escape é ASCII puro, então atravessa qualquer
# copiar-e-colar sem se corromper — o starship converte na hora de
# renderizar. Se um ícone aparecer como quadradinho, o problema é a
# fonte; se aparecer o texto "\ue0a0" literal, é o starship não tendo
# interpretado (verifique se está entre aspas DUPLAS, não simples).
#
# Referência dos códigos: nerdfonts.com/cheat-sheet
#
# PRINCÍPIOS MANTIDOS
#   - cor no TEXTO, nunca no fundo
#   - cores por NOME da paleta ANSI, nunca hex, para acompanhar o tema
#   - cada elemento com sua própria cor: colorido, mas dessaturado

add_newline = true
command_timeout = 500

format = """
$directory$git_branch$git_status$cmd_duration$battery
$character"""

#### Diretório ################################################

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "blue"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "\u2026/"          # …/
home_symbol = "~"
read_only = " \uf023"                  # cadeado
read_only_style = "red"

#### Git ######################################################

[git_branch]
symbol = "\ue0a0 "                     # glifo de branch (Powerline)
format = " [$symbol$branch]($style)"
style = "purple"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "yellow"
conflicted = " \uf071"                 # triângulo de alerta
untracked   = " ?"
modified    = " ~"
staged      = " +"
renamed     = " \u00bb"                # »
deleted     = " \u2718"                # ✘
stashed     = " \u2261"                # ≡
ahead    = " \u21e1${count}"           # ⇡
behind   = " \u21e3${count}"           # ⇣
diverged = " \u21d5${ahead_count}/${behind_count}"

#### Contexto #################################################

[cmd_duration]
min_time = 3000
format = " [\uf252 $duration]($style)"  # ampulheta
style = "bright-black"

# Bateria só aparece quando está baixa. Você já tem o percentual
# permanente na waybar; repetir no prompt é ruído.
[battery]
disabled = false
format = " [$symbol$percentage]($style)"
full_symbol      = "\uf240"
charging_symbol  = "\uf0e7"            # raio
discharging_symbol = "\uf243"

[[battery.display]]
threshold = 20
style = "red"

#### Cursor ###################################################

[character]
success_symbol = "[\u276f](green)"     # ❯
error_symbol   = "[\u276f](red)"
vimcmd_symbol  = "[\u276e](purple)"    # ❮

#### Desligados de propósito ##################################
# Sobriedade é o que NÃO aparece. Ligue um por vez, só se sentir falta.

[hostname]
disabled = true

[username]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[lua]
disabled = true
